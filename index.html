<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="description" content="Maratone a Bíblia como uma plataforma de séries: cada livro é uma série e cada grupo de capítulos é um episódio. NVI, ARA e ARC." />
    <meta property="og:title" content="BíbliaFlix — Seu app de maratona bíblica" />
    <meta property="og:description" content="Troque a maratona de séries pela maratona da Palavra." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://www.abibliadigital.com.br" />
    <title>BíbliaFlix</title>
    <script type="module" crossorigin src="./assets/index-c-aPkIvM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BJ9CaMf8.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Diagnóstico: se o app não iniciar (ex.: GitHub Pages publicando o branch errado), mostra o motivo.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) {
          errors.push((e.message || (e.target && (e.target.src || e.target.href)) || 'erro desconhecido') + '');
        }, true);
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.children.length) return;
          var dev = !!document.querySelector('script[src*="/src/main.tsx"]');
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#141414;color:#fff;font-family:system-ui,sans-serif;padding:24px">' +
            '<div style="max-width:560px"><h1 style="color:#e50914;font-size:28px;margin:0 0 12px">BíbliaFlix não iniciou</h1>' +
            (dev
              ? '<p>O GitHub Pages está publicando o <b>código-fonte</b> em vez do app pronto.</p><p>Corrija em <b>Settings → Pages → Build and deployment</b>: Source <b>Deploy from a branch</b>, Branch <b>gh-pages</b>, pasta <b>/ (root)</b> → Save. Aguarde 1–2 minutos e recarregue.</p>'
              : '<p>Ocorreu um erro ao carregar o app. Tente recarregar com <b>Ctrl+Shift+R</b>.</p>') +
            (errors.length ? '<pre style="white-space:pre-wrap;color:#aaa;font-size:12px;margin-top:16px">' + errors.slice(0, 5).join('\n').replace(/</g, '&lt;') + '</pre>' : '') +
            '</div></div>';
        }, 4000);
      })();
    </script>
  </body>
</html>
