name: Verificar app publicado

on:
  workflow_run:
    workflows: ['Publicar BíbliaFlix (GitHub Pages)']
    types: [completed]
  workflow_dispatch:

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Diagnóstico do servidor
        run: |
          U=https://axunucwmkupmfyfmkryl.supabase.co/rest/v1/rpc/church_status
          K=sb_publishable_SwlmVFP0ok0I61YFICaxGg_VTYB4lCK
          echo "so apikey:"; curl -s -X POST $U -H "apikey: $K" -H 'Content-Type: application/json' -d '{"p_slug":"exemplo"}'; echo
          echo "apikey + bearer:"; curl -s -X POST $U -H "apikey: $K" -H "Authorization: Bearer $K" -H 'Content-Type: application/json' -d '{"p_slug":"exemplo"}'; echo
          echo "cors:"; curl -s -i -X OPTIONS $U -H 'Origin: https://lordravenclaw32.github.io' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: apikey,authorization,content-type' | head -20
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Aguarda o GitHub Pages atualizar
        run: sleep 90
      - run: node scripts/smoke-online.mjs
        env:
          SHOTS: shots
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telas
          path: shots
